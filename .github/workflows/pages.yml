name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache-busting versie in de HTML zetten
        run: |
          V=$(git log -1 --format=%h)
          sed -i "s/style\.css?v=[^ >]*/style.css?v=$V/g" aanvraag.html
          sed -i "s/aanvraag\.js?v=[^ >]*/aanvraag.js?v=$V/g" aanvraag.html
          grep -n '?v=' aanvraag.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4